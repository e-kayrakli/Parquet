name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        version: [2.8.0, 2.9.0, latest]
    runs-on: ubuntu-latest
    container:
      image: chapel/chapel:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install arrow/parquet dependencies
        run: |
          apt update
          apt install -y -V ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb

          # this should be all thats required, but some OSes don't
          # have these by default, hence the above steps
          apt-get update
          apt-get install -y libarrow-dev libparquet-dev
      - name: Check the project builds
        run: |
          mason build
      - name: Check the examples build and run
        run: |
          if ls example/*.chpl >/dev/null 2>&1; then
            mason build --example
            for example in example/*.chpl; do
              mason run --example $(basename $example);
            done
          else
            echo "No examples found, skipping."
          fi
      - name: Run mason tests
        run: |
          mason test --show --parallel
  tests-from-source:
    strategy:
      fail-fast: false
      matrix:
        version: [2.8.0, latest]
    runs-on: ubuntu-latest
    container:
      image: chapel/chapel:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine Arrow version
        run: |
          ARROW_VERSION=$(sed -nE 's/^ARROW_VERSION=\$\{ARROW_VERSION:-"([^"]+)"\}/\1/p' build_arrow.sh)
          echo "ARROW_VERSION=${ARROW_VERSION}" >> $GITHUB_ENV
          ARROW_SCRIPT_SHA=$(sha256sum build_arrow.sh | cut -d' ' -f1)
          echo "ARROW_SCRIPT_SHA=${ARROW_SCRIPT_SHA}" >> $GITHUB_ENV
      - name: cache Arrow install
        id: cache-arrow
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            deps/arrow-${{ env.ARROW_VERSION }}
            arrow.sh
          key: arrow-${{ env.ARROW_VERSION }}-${{ env.ARROW_SCRIPT_SHA }}
      - name: Build arrow/parquet dependencies (retrying)
        if: steps.cache-arrow.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_seconds: 1200
          retry_wait_seconds: 60
          command: |
            NUM_CORES=$(nproc) ./build_arrow.sh
      - name: Check the project builds
        run: |
          . ./arrow.sh
          mason build
      - name: Check the examples build and run
        run: |
          . ./arrow.sh
          if ls example/*.chpl >/dev/null 2>&1; then
            mason build --example
            for example in example/*.chpl; do
              mason run --example $(basename $example);
            done
          else
            echo "No examples found, skipping."
          fi
      - name: Run mason tests
        run: |
          . ./arrow.sh
          mason test --show --parallel
